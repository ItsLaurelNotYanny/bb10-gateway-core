# Optional compose extension for terminal gateway runtime (mounting host tmux socket and workspace)
services:
  app:
    environment:
      - HOST_WORKSPACE=${HOST_WORKSPACE:-}
      - REQUIRE_HOST_TMUX=${REQUIRE_HOST_TMUX:-1}
    volumes:
      - ${TMUX_SOCKET_DIR:-/tmp/tmux-1000}:/tmp/tmux-1000
      - ${HOST_WORKSPACE:-/tmp}:${HOST_WORKSPACE:-/tmp}
